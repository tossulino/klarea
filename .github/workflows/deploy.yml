name: Publicar no GitHub Pages

# O site e servido pelo GitHub Pages, que nao roda build por conta propria.
# Como o projeto virou Astro, a publicacao passa por aqui: instala, builda,
# confere que nenhuma URL mudou e sobe o dist/ para o Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez. Nao cancela a que estiver em andamento, para nao
# deixar o site num estado pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Ha campanha ativa no Google Ads apontando para paginas deste site.
      # Se qualquer caminho mudar, a publicacao para aqui.
      - name: Conferir que as URLs nao mudaram
        run: ./scripts/check-urls.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
